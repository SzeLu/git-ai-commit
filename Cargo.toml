[package]
name = "git-ai-commit"
version = "1.0.0"
edition = "2021"
description = "使用 AI 生成 Conventional Commits + Body 格式的 Git commit 消息"
authors = ["Sze Lu<im.szelu@gmail.com>"]
license = "MIT"
repository = "https://github.com/SzeLu/git-ai-commit"

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
dirs = "5.0"
regex = "1.0"
tempfile = "3.0"
futures-util = "0.3"
fluent = "0.16"
# FluentBundle::new 收 Vec<LanguageIdentifier>，而 fluent 没有 re-export 这个类型，
# 只能直接依赖 unic-langid（版本必须与 fluent-bundle 内部使用的一致，否则类型不通用）。
unic-langid = "0.9"
sys-locale = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
