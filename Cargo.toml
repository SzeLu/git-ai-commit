[package]
name = "git-ai-commit"
version = "1.0.0"
edition = "2024"
description = "使用 DeepSeek AI 生成 Conventional Commits + Body 格式的 Git commit 消息"
authors = ["Sze Lu<im.szelu@gmail.com>"]
license = "MIT"
repository = "https://github.com/SzeLu/git-ai-commit"

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.0"
dirs = "5.0"
regex = "1.0"
tempfile = "3.0"
which = "4.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
